loaderVersion="[4,)"
license="All Rights Reserved"

[[mods]]
modId="aerocore"
version="${mod_version}"
displayName="AeroCore"
description='''
Reusable air and water forces and torques for vehicle mods.
Includes standard atmosphere, flow-aware polars, hydrofoils and hydrostatic buoyancy.
Includes a server-authoritative physics probe for in-game fall, float and current experiments.
The separate experimental 2D CFD tool is not included in this game JAR.
'''

[[mixins]]
config="aerocore.mixins.json"

[[dependencies.aerocore]]
modId="neoforge"
type="required"
versionRange="[${neo_version},21.2)"
ordering="NONE"
side="BOTH"

[[dependencies.aerocore]]
modId="minecraft"
type="required"
versionRange="[1.21.1]"
ordering="NONE"
side="BOTH"
