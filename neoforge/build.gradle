plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.148'
}

base { archivesName = 'aerocore-neoforge-1.21.1' }
evaluationDependsOn(':physics')
dependencies { api project(':physics') }

// NFRT performs many small ZIP writes. Keep scratch files local even on a network checkout.
// This property belongs to the pinned ModDevGradle 2.0.148 task API.
// Stable across a mapped drive (Z:) and its UNC alias. Override only for an independent checkout.
def runtimeId = providers.gradleProperty('aerocore_runtime_id').getOrElse('aerocore')
if (!(runtimeId ==~ /[A-Za-z0-9_-]+/)) { throw new GradleException('Invalid aerocore_runtime_id') }
def localRuntimeRoot = new File(System.getProperty('user.home'), ".mcmod/runs/${runtimeId}")
// Java NIO pipes (the integrated server's local channel, HTTP clients) use Unix-domain sockets in the temp
// directory on Windows. Redirected %TEMP% (packaged apps, IDEs not started by open-ide.cmd) breaks them, so
// every game run uses the same local temp folder as dev.ps1, whatever launched Gradle or the IDE.
def localTemp = new File(System.getProperty('user.home'), '.mcmod/tmp')
localTemp.mkdirs()
def scratchKey = runtimeId
tasks.withType(net.neoforged.nfrtgradle.NeoFormRuntimeTask).configureEach {
    workDirectory = new File(gradle.gradleUserHomeDir, "caches/aerocore-work/${scratchKey}/${project.name}")
}
// 0.33.1 (DevWindow): the development client opens on this monitor (1 the primary) without taking focus or the mouse,
// out of the way of a game being played on the primary monitor; -Pdev_window_monitor=0 opens it as usual.
def devWindowMonitor = providers.gradleProperty('dev_window_monitor').getOrElse('2')
if (!(devWindowMonitor ==~ /\d+/)) { throw new GradleException('Invalid dev_window_monitor') }
// NeoForge's early loading window opens on the primary monitor and takes focus before any mod runs: the client run
// turns it off in its own config/fml.toml (FML fills in the other keys), so the game's window is the first one.
def quietEarlyWindow = { File gameDirectory ->
    if (devWindowMonitor == '0') { return }
    def toml = new File(gameDirectory, 'config/fml.toml')
    def text = toml.isFile() ? toml.getText('UTF-8') : ''
    def line = /(?m)^earlyWindowControl\s*=.*$/
    def quiet = text =~ line ? text.replaceAll(line, 'earlyWindowControl = false')
            : text + (text.isEmpty() || text.endsWith('\n') ? '' : '\n') + 'earlyWindowControl = false\n'
    if (quiet != text) {
        toml.parentFile.mkdirs()
        toml.setText(quiet, 'UTF-8')
    }
}

neoForge {
    version = rootProject.neo_version
    runs {
        client {
            client()
            gameDirectory = file(new File(localRuntimeRoot, 'client'))
            systemProperty 'aerocore.window.monitor', devWindowMonitor
        }
        server {
            server()
            gameDirectory = file(new File(localRuntimeRoot, 'server'))
            programArgument '--nogui'
        }
        gameTestServer {
            type = 'gameTestServer'
            gameDirectory = file(new File(localRuntimeRoot, 'gametest'))
            systemProperty 'neoforge.enabledGameTestNamespaces', 'aerocore'
            systemProperty 'aerocore.gametests', 'true'
        }
        configureEach {
            systemProperty 'java.io.tmpdir', localTemp.absolutePath
            systemProperty 'jdk.net.unixdomain.tmpdir', localTemp.absolutePath
        }
    }
    mods {
        aerocore {
            sourceSet sourceSets.main
            sourceSet project(':physics').sourceSets.main
        }
    }
}

tasks.matching { it.name == 'runClient' }.configureEach { doFirst { quietEarlyWindow(new File(localRuntimeRoot, 'client')) } }

tasks.register('showRuntimeDirectories') {
    doLast {
        println "AeroCore client: ${new File(localRuntimeRoot, 'client')}"
        println "AeroCore server: ${new File(localRuntimeRoot, 'server')}"
        println "AeroCore GameTest: ${new File(localRuntimeRoot, 'gametest')}"
    }
}

def generateModMetadata = tasks.register('generateModMetadata', ProcessResources) {
    def properties = [mod_version: project.version, neo_version: rootProject.neo_version]
    inputs.properties properties
    expand properties
    from 'src/main/templates'
    into layout.buildDirectory.dir('generated/modMetadata')
}
sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

// Ship the platform-independent API inside the mod, so players install one JAR.
tasks.named('jar') { from project(':physics').sourceSets.main.output }
tasks.named('sourcesJar') { from project(':physics').sourceSets.main.allSource }

// The game JAR (with the physics API inside) for mods that build against AeroCore, without dependencies: a mod adds
// it as a mod and must not pull the physics JAR as well (the same packages twice break the module layer).
apply plugin: 'maven-publish'
publishing {
    publications {
        maven(MavenPublication) {
            artifactId = 'aerocore-neoforge-1.21.1'
            artifact tasks.named('jar')
            artifact tasks.named('sourcesJar')
        }
    }
    // build/repo in the project, not under the build directory (on this computer's disk, root build.gradle): hdfv and the
    // other computer read it there.
    repositories { maven { name = 'workspace'; url = rootProject.file('build/repo') } }
}
